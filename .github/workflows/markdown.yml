name: Markdown integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check generated documentation
        run: python .python/generate_markdown.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install declaration test compiler
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Check runtime declarations and isolated type fixtures
        run: npm run test:runtimes

      - name: Test documentation validation
        run: python -m unittest discover -s .python/tests
